<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <aside class="info-panel">
      <figure>
        <img src="./eisenhower-matrix.jpg" alt="Matrix">
        <figcaption>
          <a class="details-link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
        </figcaption>
      </figure>
    </aside>
    
    <main class="todo-container">
      <section aria-labelledby="add-task-heading">
        <p id="add-task-section">
          <label for="new-task">Add Item</label>
          <div class="input-group">
            <input id="new-task" class="task-input form-control" type="text">
            <button class="add-btn btn">Add</button>
          </div>
        </p>
      </section>

      <section aria-labelledby="todo-heading">
        <h3 class="section-title">Todo</h3>
        <ul id="pending-tasks" class="task-list">
          <li class="list-item">
            <input type="checkbox">
            <label class="task-label">Pay Bills</label>
            <input type="text" class="task-input form-control">
            <button class="edit-btn btn">Edit</button>
            <button class="delete-btn btn">
              <img src="./remove.svg" alt="Delete">
            </button>
          </li>
          <li class="list-item task-item edit-mode">
            <input type="checkbox">
            <label class="task-label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task-input form-control">
            <button class="save-btn btn">Save</button>
            <button class="delete-btn btn">
              <img src="./remove.svg" alt="Delete">
            </button>
          </li>
        </ul>
      </section>

      <section aria-labelledby="completed-heading">
        <h3 class="section-title">Completed</h3>
        <ul id="completed-tasks" class="task-list">
          <li class="list-item">
            <input type="checkbox" checked>
            <label class="task-label">See the Doctor</label>
            <input type="text" class="task-input form-control">
            <button class="edit-btn btn">Edit</button>
            <button class="delete-btn btn">
              <img src="./remove.svg" alt="Delete">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
